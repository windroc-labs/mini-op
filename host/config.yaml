# Every setting with its default; ~/.mini-op/config.local.yaml overrides these values.
# Empty: not set; set it in ~/.mini-op/config.local.yaml (the mini's LAN IPv4).
mini_host: ""
# Empty: not set; set it in ~/.mini-op/config.local.yaml (the mini's account).
mini_user: ""
# The mini's ssh port; egress must allow the same endpoint.
mini_port: 22
